#
# Continuous integration. Owner: A02, reviewed by A01. The logic lives in tools/ci/ so that the
# same scripts run locally. Every action is pinned to a full commit SHA with its tag in a comment
# (P0-09b); tools/ci/check-pins.sh enforces it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Licence headers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: tools/ci/spdx-check.sh
      - run: tools/ci/check-pins.sh --selftest
      - run: tools/ci/check-pins.sh

  toolchain:
    name: Cross toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Restore the toolchain cache
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/opt/cross
          key: cross-toolchain-${{ runner.os }}-${{ hashFiles('toolchain/versions.txt', 'toolchain/build-cross.sh') }}
      - name: Build the cross toolchain (cache miss only)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          toolchain/install-deps.sh
          KAMOS_JOBS="$(nproc)" toolchain/build-cross.sh

  build-test:
    name: Build and boot (${{ matrix.cpu }}, ${{ matrix.profile }})
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cpu: [qemu64, max]
        profile: [debug, release]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/opt/cross
          key: cross-toolchain-${{ runner.os }}-${{ hashFiles('toolchain/versions.txt', 'toolchain/build-cross.sh') }}
          fail-on-cache-miss: true
      - run: toolchain/install-deps.sh
      - run: tools/ci/build-test.sh ${{ matrix.cpu }} ${{ matrix.profile }}
      - name: Keep the serial log and checksums
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: boot-${{ matrix.cpu }}-${{ matrix.profile }}
          path: |
            build/${{ matrix.profile }}/serial.log
            build/${{ matrix.profile }}/SHA256SUMS
          if-no-files-found: warn

  reproducible:
    name: Reproducible build (${{ matrix.profile }})
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, release]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/opt/cross
          key: cross-toolchain-${{ runner.os }}-${{ hashFiles('toolchain/versions.txt', 'toolchain/build-cross.sh') }}
          fail-on-cache-miss: true
      - run: toolchain/install-deps.sh
      - run: tools/ci/reproducible.sh ${{ matrix.profile }}

  negative-selftest:
    name: The pipeline rejects a broken source
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/opt/cross
          key: cross-toolchain-${{ runner.os }}-${{ hashFiles('toolchain/versions.txt', 'toolchain/build-cross.sh') }}
          fail-on-cache-miss: true
      - run: toolchain/install-deps.sh
      - run: tools/ci/negative-selftest.sh

  kernel-build-rules:
    name: Kernel build rules (fixture)
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/opt/cross
          key: cross-toolchain-${{ runner.os }}-${{ hashFiles('toolchain/versions.txt', 'toolchain/build-cross.sh') }}
          fail-on-cache-miss: true
      - run: toolchain/install-deps.sh
      - run: tools/ci/kbuild-selftest.sh
      - name: QEMU profiles
        run: |
          export PATH="$HOME/opt/cross/bin:$PATH"
          make all iso CROSS=x86_64-elf-
          tools/qemu/selftest.sh
      - run: tools/ci/reproducible-negative.sh

  static-analysis:
    name: Static analysis and format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update && sudo apt-get install -y cppcheck clang-format
      - run: tools/ci/static-analysis.sh --selftest
      - run: tools/ci/static-analysis.sh

  test-host:
    name: Host unit tests (ASan, UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: make test-host
      - run: make test-framework-selftest

  hal-scenarios:
    name: HAL scenarios (${{ matrix.cpu }}, ${{ matrix.profile }})
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cpu: [qemu64, max]
        profile: [debug, release]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/opt/cross
          key: cross-toolchain-${{ runner.os }}-${{ hashFiles('toolchain/versions.txt', 'toolchain/build-cross.sh') }}
          fail-on-cache-miss: true
      - run: toolchain/install-deps.sh
      - name: Build the ISO
        run: |
          export PATH="$HOME/opt/cross/bin:$PATH"
          make iso CROSS=x86_64-elf- KAMOS_DEBUG=${{ matrix.profile == 'debug' && '1' || '0' }}
      - name: Run the scenarios (a flaky scenario is reported, the oracle is not loosened)
        run: |
          export PATH="$HOME/opt/cross/bin:$PATH"
          tests/hal/run-scenarios.sh ${{ matrix.profile }} ${{ matrix.cpu }}
      - name: Keep the scenario logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scenarios-${{ matrix.cpu }}-${{ matrix.profile }}
          path: build/${{ matrix.profile }}/scenario-*.log
          if-no-files-found: warn
