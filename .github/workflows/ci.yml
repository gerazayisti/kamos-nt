# Continuous integration. Owner: A02, reviewed by A01. The logic lives in tools/ci/ so that the
# same scripts run locally. Third-party actions are pinned to a major tag for now; pinning to
# full commit SHAs is tracked in docs/coordination/BOARD.md (P0-09b).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Licence headers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: tools/ci/spdx-check.sh

  toolchain:
    name: Cross toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Restore the toolchain cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/opt/cross
          key: cross-toolchain-${{ runner.os }}-${{ hashFiles('toolchain/versions.txt', 'toolchain/build-cross.sh') }}
      - name: Build the cross toolchain (cache miss only)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          toolchain/install-deps.sh
          KAMOS_JOBS="$(nproc)" toolchain/build-cross.sh

  build-test:
    name: Build and boot (${{ matrix.cpu }}, ${{ matrix.profile }})
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cpu: [qemu64, max]
        profile: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: ~/opt/cross
          key: cross-toolchain-${{ runner.os }}-${{ hashFiles('toolchain/versions.txt', 'toolchain/build-cross.sh') }}
          fail-on-cache-miss: true
      - run: toolchain/install-deps.sh
      - run: tools/ci/build-test.sh ${{ matrix.cpu }} ${{ matrix.profile }}
      - name: Keep the serial log and checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-${{ matrix.cpu }}-${{ matrix.profile }}
          path: |
            build/${{ matrix.profile }}/serial.log
            build/${{ matrix.profile }}/SHA256SUMS
          if-no-files-found: warn

  reproducible:
    name: Reproducible build (${{ matrix.profile }})
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: ~/opt/cross
          key: cross-toolchain-${{ runner.os }}-${{ hashFiles('toolchain/versions.txt', 'toolchain/build-cross.sh') }}
          fail-on-cache-miss: true
      - run: toolchain/install-deps.sh
      - run: tools/ci/reproducible.sh ${{ matrix.profile }}

  negative-selftest:
    name: The pipeline rejects a broken source
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: ~/opt/cross
          key: cross-toolchain-${{ runner.os }}-${{ hashFiles('toolchain/versions.txt', 'toolchain/build-cross.sh') }}
          fail-on-cache-miss: true
      - run: toolchain/install-deps.sh
      - run: tools/ci/negative-selftest.sh

  kernel-build-rules:
    name: Kernel build rules (fixture)
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: ~/opt/cross
          key: cross-toolchain-${{ runner.os }}-${{ hashFiles('toolchain/versions.txt', 'toolchain/build-cross.sh') }}
          fail-on-cache-miss: true
      - run: toolchain/install-deps.sh
      - run: tools/ci/kbuild-selftest.sh
      - name: QEMU profiles
        run: |
          export PATH="$HOME/opt/cross/bin:$PATH"
          make all iso CROSS=x86_64-elf-
          tools/qemu/selftest.sh
      - run: tools/ci/reproducible-negative.sh

  static-analysis:
    name: Static analysis and format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cppcheck clang-format
      - run: tools/ci/static-analysis.sh --selftest
      - run: tools/ci/static-analysis.sh
